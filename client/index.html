<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Wellsyn – Your wellness. Connected. Alimentazione, allenamento e supporto professionale in un unico luogo." />
    <meta name="theme-color" content="#0f5a53" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Wellsyn – Your wellness. Connected.</title>
    <script>
      // Tema e lingua salvati: applicati subito, prima che si carichi l'app (niente lampo bianco).
      try {
        var prefs = JSON.parse(localStorage.getItem('wellsyn.prefs') || '{}');
        var dark = prefs.theme === 'dark' || (prefs.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        if (prefs.language === 'en') document.documentElement.lang = 'en';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
